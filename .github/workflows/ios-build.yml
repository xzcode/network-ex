name: iOS unsigned build
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/ios-build.yml']
permissions:
  contents: read
concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: macos-15-intel
    # Xcode can cross-build the ARM64 device target on Intel; avoid the ARM queue.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
      - name: Toolchain
        run: |
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          go version
          brew install xcodegen
      - name: Compile app and extension without signing
        run: bash scripts/build-ios.sh compile
      - name: Verify unsigned app and extension
        run: |
          set -euo pipefail
          app=apps/ios/build/device/Build/Products/Debug-iphoneos/NetworkEX.app
          test -f "$app/NetworkEX"
          test -d "$app/PlugIns/PacketTunnel.appex"
          file "$app/NetworkEX" "$app/PlugIns/PacketTunnel.appex/PacketTunnel"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app" artifacts/Network-EX-iOS-unsigned.zip
          (cd artifacts && shasum -a 256 *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: network-ex-ios-unsigned
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
