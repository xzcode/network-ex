name: iOS unsigned build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Compile app and extension without signing
        run: bash scripts/build-ios.sh compile
