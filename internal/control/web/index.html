<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Network EX 管理</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head><body>
<header><strong>Network EX</strong><span>私有网络控制台</span><div class="spacer"></div><span id="identity"></span><button id="logout" hidden>退出</button></header>
<main><section id="loginpanel" class="login card"><h1>管理服务</h1><p>使用已创建的管理员或成员账号。</p><form id="login"><label>账号<input name="login" required autocomplete="username"></label><label>密码<input name="password" required type="password" autocomplete="current-password"></label><button class="primary">登录</button></form></section>
<div id="dashboard" hidden><div class="bar"><h1>虚拟网络</h1><button id="refresh">刷新</button></div><div class="layout"><aside class="card"><h2>网络列表</h2><div id="networks"></div><hr><h3>创建网络</h3><form id="createNetwork"><label>名称<input name="name" required maxlength="80"></label><label>IPv4 网段<input name="cidr" required placeholder="10.88.0.0/24"></label><label>默认访问策略<select name="policy"><option value="deny_members">仅允许明确授权的设备对</option><option value="allow_members">允许同网络已审批成员</option></select></label><button class="primary">创建网络</button></form></aside>
<section class="card content"><div id="empty"><h2>选择一个网络</h2><p>管理设备、邀请与访问策略。</p></div><div id="networkDetail" hidden><div class="bar"><div><h2 id="networkName"></h2><p id="networkInfo"></p></div><button id="inviteButton" class="primary">创建一次性邀请</button></div><div id="inviteResult" hidden class="invite"><p>邀请仅显示一次，供目标设备注册使用。</p><input id="inviteCode" readonly aria-label="邀请码"><button id="copyInvite">复制邀请码</button></div><form id="policy"><label>默认访问策略<select name="policy"><option value="deny_members">仅允许明确授权的设备对</option><option value="allow_members">允许同网络已审批成员</option></select></label><button>保存策略</button></form><h3>设备</h3><div class="tablewrap"><table><thead><tr><th>名称</th><th>虚拟 IP</th><th>审批状态</th><th>最近联系</th><th>操作</th></tr></thead><tbody id="devices"></tbody></table></div><h3>设备对访问规则</h3><form id="rule" class="inline"><select name="a" required aria-label="设备 A"></select><select name="b" required aria-label="设备 B"></select><select name="allow" aria-label="访问权限"><option value="true">允许</option><option value="false">拒绝</option></select><button>应用规则</button></form><div id="rules"></div></div></section></div>
<section id="admin" class="card" hidden><h2>用户管理</h2><form id="createUser" class="inline"><input name="login" required placeholder="新用户账号" autocomplete="off"><input name="password" type="password" minlength="12" maxlength="256" required placeholder="至少 12 字节" autocomplete="new-password"><button>创建成员账号</button></form><div id="users"></div><h2>最近审计记录</h2><div class="tablewrap"><table><thead><tr><th>时间</th><th>操作</th><th>操作者</th><th>目标</th></tr></thead><tbody id="audit"></tbody></table></div></section></div>
<p id="message" role="status" aria-live="polite"></p></main><footer>Network EX · M3 开发版 · 数据由管理 API 实时提供</footer></body></html>
